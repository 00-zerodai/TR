<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes: A Simple Landscape Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img src="images/hero.jpg" alt="Layered blue hills under a glowing sunset sky">
    <div class="hero-text">
      <h1>Field Notes</h1>
      <p>A small gallery of landscapes, from sunrise to dusk.</p>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>About this page</h2>
      <p>This is a simple, single-page gallery. Each section below shows one landscape with a short caption. Scroll down to see them all.</p>
    </section>

    <section class="gallery">
      <figure>
        <img src="images/meadow.jpg" alt="Green meadow under a bright blue sky">
        <figcaption>Meadow: open fields on a clear morning.</figcaption>
      </figure>

      <figure>
        <img src="images/dusk.jpg" alt="Purple hills at dusk with a low sun">
        <figcaption>Dusk: the last light behind the ridge.</figcaption>
      </figure>

      <figure>
        <img src="images/desert.jpg" alt="Warm sand dunes under a pale sky">
        <figcaption>Desert: dunes in the afternoon heat.</figcaption>
      </figure>

      <figure>
        <img src="images/ocean.jpg" alt="Deep blue coastline with layered water">
        <figcaption>Ocean: calm water along the coast.</figcaption>
      </figure>

      <figure>
        <img src="images/forest.jpg" alt="Dark green forest hills in soft mist">
        <figcaption>Forest: mist over the tree line.</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>All images on this page were generated by me and are free to reuse.</p>
  </footer>
</body>
</html>
